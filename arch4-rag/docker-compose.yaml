version: "3.9"

# ------------------------------------------------------------------
# floci (로컬 AWS 에뮬레이터: S3, S3 Vectors, Lambda, API Gateway, IAM 등)
#
# llama.cpp는 여기서 띄우지 않습니다 — 별도로 직접 실행하세요. 예:
#   ./llama-server -m ./models/embedding-model.gguf --embedding --pooling mean --port 8081
#   ./llama-server -m ./models/chat-model.gguf --port 8082
#
# floci가 Lambda를 실제 도커 컨테이너로 띄우므로 docker.sock 마운트가 필요합니다.
# Lambda 컨테이너에서 호스트에서 직접 실행 중인 llama.cpp로 접근할 때는
# host.docker.internal 을 사용합니다 (아래 extra_hosts 참고).
# ------------------------------------------------------------------

services:
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
    environment:
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # Linux 호스트에서 host.docker.internal 사용 가능하게 함 (Lambda 컨테이너 -> 호스트 llama.cpp)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30
